<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Four stacked vertebrae with discs between them, in the app's teal. -->
  <rect width="32" height="32" rx="7" fill="#0f766e"/>
  <g fill="#ffffff">
    <rect x="9" y="4" width="14" height="4.5" rx="1.6"/>
    <rect x="8.5" y="11" width="15" height="4.5" rx="1.6"/>
    <rect x="8" y="18" width="16" height="4.5" rx="1.6"/>
    <rect x="7.5" y="25" width="17" height="4" rx="1.6"/>
  </g>
  <g fill="#5eead4">
    <rect x="11" y="9" width="10" height="1.4" rx=".7"/>
    <rect x="10.5" y="16" width="11" height="1.4" rx=".7"/>
    <rect x="10" y="23" width="12" height="1.4" rx=".7"/>
  </g>
</svg>
